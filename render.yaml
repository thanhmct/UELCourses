# UELPATH — Render Blueprint cho bản triển khai miễn phí (Free Web Service, Docker)
# Hướng dẫn chi tiết: docs/DEPLOY_FREE.md

services:
  - type: web
    name: uelcourses-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: docker/api.Dockerfile
    dockerContext: api
    # Gói Render Free không hỗ trợ preDeployCommand (chỉ có trên gói trả phí).
    # Lệnh khởi động nằm trong api/start.sh (chạy Alembic rồi uvicorn).
    # KHÔNG đặt chuỗi "a && b" thẳng ở đây: Render bọc lại bằng shell nên báo exit 127.
    dockerCommand: sh /app/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase Transaction pooler cổng 6543 (postgresql+psycopg://...?sslmode=require)
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: SESSION_SECRET
        generateValue: true # Render tự sinh chuỗi bí mật ngẫu nhiên an toàn cho production
      - key: CORS_ORIGINS
        sync: false # Dán URL frontend Vercel (ví dụ: https://uelcourses.vercel.app)
      - key: AUTO_SEED
        value: "false" # Không nạp dữ liệu mẫu vào database production
      - key: ENV
        value: production # Kích hoạt chốt chặn an toàn production trong app/config.py
      - key: FRONTEND_BASE_URL
        sync: false # URL frontend Vercel để redirect sau đăng nhập (ví dụ: https://uelcourses.vercel.app)
      - key: OAUTH_REDIRECT_BASE
        sync: false # URL công khai của API Render (ví dụ: https://uelcourses-api.onrender.com)
      - key: PORT
        value: "8000"
      - key: RATE_LIMIT_DEFAULT
        value: "240/minute"
      - key: RATE_LIMIT_HEAVY
        value: "20/minute"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: BLOCK_EMPTY_USER_AGENT
        value: "false"
      # Bảo vệ máy yếu: tối đa 20 request /api/* cùng lúc, vượt mức trả 503 ngay (0 = tắt).
      - key: MAX_INFLIGHT_REQUESTS
        value: "20"
      # Số proxy đáng tin phía trước app để lấy đúng IP khách: Render = 1; thêm Cloudflare = 2 (API đang sau Cloudflare).
      - key: TRUSTED_PROXY_HOPS
        value: "2"
