# UELPlan — cấu hình chạy production/staging.
#   docker compose up -d --build
# Phát triển (hot reload): docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Bật AI local (Ollama):   docker compose --profile ollama up -d

name: uelplan

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uelplan}
      POSTGRES_USER: ${POSTGRES_USER:-uelplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uelplan} -d ${POSTGRES_DB:-uelplan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uelplan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uelplan}
      DATA_DIR: /app/data
      REGULATIONS_DIR: /regulations
      RAG_INDEX_DIR: /app/data/rag_index
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - apidata:/app/data
      - ./regulations:/regulations:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  apidata:
  ollama:
