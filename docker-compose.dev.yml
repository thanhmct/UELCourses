# Ghi đè cho môi trường phát triển: mount source code, tự reload khi sửa file.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    ports:
      - "5432:5432"   # để xem DB bằng DBeaver/pgAdmin khi dev

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    user: root        # tránh lỗi quyền ghi khi mount thư mục từ Windows
    environment:
      WATCHFILES_FORCE_POLLING: "true"   # reload hoạt động với ổ đĩa Windows mount vào
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3100"
      ADMIN_DEV_OPEN: ${ADMIN_DEV_OPEN:-false}   # chỉ dev: vào /admin không cần đăng nhập
    volumes:
      - ./api:/app
      - /app/.venv          # không dùng venv Windows bên trong container
      - /app/.venv-rag
      - apidata:/app/data

  # `web` (Next dev) chỉ chạy khi cần: `docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile web up web`.
  # Khi dev bình thường, giao diện chạy trong `workspace` (cổng 3001) hoặc server Next trên máy (cổng 3000);
  # không để `web` tự tạo kẻo tranh cổng 3000 và để lại container "Created" vô dụng.
  web:
    profiles: ["web"]
    build:
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      - /app/node_modules   # giữ node_modules Linux của container
      - /app/.next

  # Container làm việc DÙNG CHUNG cho Claude / Gemini / ChatGPT (cùng môi trường, cùng database `db`).
  #   .\scripts\dev.ps1 up   ->   .\scripts\dev.ps1 setup   ->   .\scripts\dev.ps1 run <lệnh>
  workspace:
    build:
      context: ./docker
      dockerfile: workspace.Dockerfile
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uelplan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uelplan}
      DATA_DIR: /workspace/data/db
      REGULATIONS_DIR: /workspace/regulations
      RAW_DATA_DIR: /workspace/data/raw
      AUTO_SEED: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3100
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - workspace_venv:/opt/venv
      - workspace_node_modules:/workspace/web/node_modules
    ports:
      - "8001:8000"   # uvicorn chạy trong workspace
      - "3001:3000"   # next dev chạy trong workspace

  # Container RIÊNG cho việc chạy LÂU (parse đề cương, OCR, import lớn). Phiên khác có thể khởi động lại `workspace`
  # (vd để chạy dev server) và sẽ giết mọi tiến trình đang chạy trong đó — `jobs` không bị ảnh hưởng.
  #   .\scripts\dev.ps1 job python -m app.cli parse-outlines
  jobs:
    extends:
      service: workspace
    ports: !reset []
    command: ["sleep", "infinity"]

volumes:
  workspace_venv:
  workspace_node_modules:
